[project]
name = "ai-filing-analyst"
version = "1.0.0"
description = "Financial filing analyst agent on Strands Agents over SEC XBRL data, instrumented for Base14 Scout"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "base14", email = "hello@base14.io" }]
keywords = ["strands-agents", "sec", "xbrl", "agents", "opentelemetry", "fastapi", "base14-scout"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
strands = [
    "strands-agents[otel,ollama]==1.57.1",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-psycopg==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-logging==0.66b0",
]
adk = [
    "google-adk==2.10.0",
    "litellm==1.103.0",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-api==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-psycopg==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "opentelemetry-instrumentation-logging==0.63b1",
]
maf = [
    "agent-framework-core==1.19.0",
    "agent-framework-ollama==1.0.0b260813",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-psycopg==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-logging==0.66b0",
]
openai-agents = [
    "openai-agents==0.22.3",
    "opentelemetry-instrumentation-genai-openai-agents==1.2b0",
    "opentelemetry-instrumentation-genai-openai==1.2b0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-psycopg==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
    "opentelemetry-instrumentation-logging==0.66b0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-pyyaml==6.0.12.20260906",
]

[project.urls]
Homepage = "https://github.com/base-14/examples"
Documentation = "https://docs.base14.io"
Repository = "https://github.com/base-14/examples"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [
    [
        { extra = "strands" },
        { extra = "adk" },
        { extra = "maf" },
        { extra = "openai-agents" },
    ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/filing_analyst"]
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "RUF",    # ruff-specific
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments
    "PLR2004",  # magic value comparison
    "ARG001",   # unused function argument
    "ARG002",   # unused method argument
    "B008",     # function call in default argument
    "TC002",    # move third-party import to type-checking block
    "TC003",    # move stdlib import to type-checking block
    "PLC0415",  # import not at top level
    "PLW0603",  # global statement
]

[tool.ruff.lint.isort]
known-first-party = ["filing_analyst", "scripts"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/filing_analyst"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
