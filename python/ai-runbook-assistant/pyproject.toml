[project]
name = "ai-runbook-assistant"
version = "0.1.0"
description = "SRE runbook assistant (LangChain + RAG) with OpenTelemetry via callback handlers, observable in Base14 Scout"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "base14", email = "hello@base14.io" }]
keywords = ["langchain", "opentelemetry", "callback-handler", "sre", "rag", "fastapi", "ai-agents", "base14-scout"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "pgvector==0.3.6",
    "langchain==1.3.18",
    "langchain-core==1.6.1",
    "langchain-ollama==1.1.0",
    "langchain-anthropic==1.7.0",
    "langchain-openai==1.6.0",
    "langchain-google-genai==4.4.0",
    "langchain-postgres==0.0.17",
    "tenacity==9.1.4",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-instrumentation-langchain==0.62.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "aiosqlite==0.22.1",
    "pip-audit==2.10.1",
    "testcontainers[postgres]==4.15.0",
    # testcontainers PostgresContainer's default readiness probe uses psycopg2;
    # the integration tests also derive asyncpg/psycopg URLs from its psycopg2 URL.
    "psycopg2-binary==2.9.12",
    "types-pyyaml==6.0.12.20260815",
]

[project.urls]
Homepage = "https://github.com/base-14/examples"
Documentation = "https://docs.base14.io"
Repository = "https://github.com/base-14/examples"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runbook_assistant"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "RUF",    # ruff-specific
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
    "ARG001",   # unused function argument
    "ARG002",   # unused method argument (needed for pytest fixtures)
    "B008",     # function call in default argument
    "TC002",    # move third-party import to type-checking block (needed for DI)
    "TC003",    # move stdlib import to type-checking block (false positive for ORM)
    "PLC0415",  # import not at top level (needed for lazy imports)
    "PLW0603",  # global statement (acceptable for singleton pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["runbook_assistant"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "langchain_ollama.*",
    "langchain_anthropic.*",
    "langchain_openai.*",
    "langchain_google_genai.*",
    "langchain_postgres.*",
    "langgraph.*",
    "anthropic.*",
    "google.genai.*",
    "opentelemetry.*",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "integration: marks tests as integration tests",
]
# TODO: Remove pydantic.v1 filter once the langchain#33926 warning clears.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Core Pydantic V1 functionality:UserWarning",
]

[tool.coverage.run]
source = ["src/runbook_assistant"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
