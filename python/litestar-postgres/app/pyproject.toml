[project]
name = "litestar-articles"
version = "0.1.0"
description = "Litestar + PostgreSQL articles API with OpenTelemetry instrumentation"
requires-python = ">=3.15"
dependencies = [
    "litestar[standard]==2.25.0",
    "msgspec==0.22.0",
    "sqlalchemy[asyncio]==2.0.58",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "advanced-alchemy==1.12.0",
    "httpx==0.28.1",
    "python-json-logger==4.2.0",
    # OpenTelemetry — SDK + auto-instrumentation
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-distro==0.66b2",
    "opentelemetry-instrumentation==0.66b2",
    "opentelemetry-instrumentation-asgi==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-asyncpg==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "aiosqlite==0.22.1",
    "greenlet==3.5.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# opentelemetry-instrumentation-sqlalchemy 0.66b2 supports sqlalchemy below 2.1 and
# instruments nothing on 2.1, so the sweep's exact-pin bumps stay on 2.0.
constraint-dependencies = ["sqlalchemy<2.1"]
