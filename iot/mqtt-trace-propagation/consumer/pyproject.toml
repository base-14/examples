[project]
name = "mqtt-trace-consumer"
version = "0.1.0"
description = "Subscribes to MQTT readings, continues the producer's trace, and calls a downstream HTTP service"
requires-python = ">=3.15"
dependencies = [
    "paho-mqtt==2.2.0",
    "requests==2.34.2",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-requests==0.66b2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
