[www]
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

ping.path = /ping
ping.response = pong

; Keep OTEL_* visible to FPM workers. The official image sets this in docker.conf; a hand-rolled pool may not.
clear_env = no
